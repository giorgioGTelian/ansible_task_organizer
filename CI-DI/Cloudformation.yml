AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy 130 Lambda functions with unique names.

PythonRuntime:
    Type: String
    Default: python3.8
    AllowedValues:
      - python3.8
      - python3.9
      - python3.11
           
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 
                  - !Sub '- arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'

  wpdpProdA3Login:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: wpdp-prod-a3login
      Handler: lambda_function.lambda_handler
      Role: arn:aws:iam::381492245723:role/service-role/wpdp-prod-dispa-role
      Code:
        S3Bucket: bucket-lambda1
        S3Key: 'lambdas.zip/lambdas (1)/wpdp-prod-a3login.zip'
      Runtime: python3.9
      Layers:
       - arn:aws:lambda:eu-west-1:381492245723:layer:pymysql:1
       - arn:aws:lambda:eu-west-1:381492245723:layer:requests:1
      Environment:
        Variables:
          sqlDBdatabase5: "wpdp_main"
          sqlDBhost5: "wpdp-prod-mysql-11032024.c32emc66e05r.eu-west-1.rds.amazonaws.com"
          sqlDBpassword5: "xeTYzyo-9oyphe-r00dp"
          sqlDBuser5: "wpdp_prod_dbadm"
          s3Bucket5: "output-input-lambda-europe-ir-prd"
          s3FolderInput5: "input"
          s3FolderOutput5: "output"
          TZ: "Europe/Rome"
      Timeout: 120
      MemorySize: 256

